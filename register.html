<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Maneigbbe</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .register-section {
            padding: 3rem 1rem;
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
        }
        .register-container {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .register-header h2 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .register-header p {
            color: #666;
        }
        .register-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            color: white;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
        }
        .btn-register {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(26, 26, 26, 0.4);
        }
        .register-error {
            background: #fee;
            color: #c00;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .register-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .register-links a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 600;
        }
        .register-links a:hover {
            text-decoration: underline;
        }
        .btn-google {
            width: 100%;
            padding: 0.9rem;
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: background 0.2s, border-color 0.2s;
        }
        .btn-google:hover {
            background: #f8f9fa;
            border-color: #1a1a1a;
        }
        .google-icon {
            width: 20px;
            height: 20px;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #999;
            font-size: 0.9rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }
        .divider span {
            padding: 0 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/mlogo.png" alt="Maneigbbe Logo">
                    <span>Maneigbbe</span>
                </a>
            </div>
            <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tracking.html">Track Package</a></li>
                    <li><a href="request-pickup.html">Request Pickup</a></li>
                </ul>
                <a href="customer-login.html" class="nav-login-btn" id="navLoginBtn">Login</a>
                <div class="nav-profile" id="navProfile" style="display:none;">
                    <button class="profile-toggle" id="profileToggle">
                        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </button>
                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="profile-dropdown-header">
                            <span class="profile-dropdown-name" id="profileDropdownName">Customer</span>
                        </div>
                        <div class="profile-dropdown-divider"></div>
                        <a href="customer-dashboard.html" class="profile-dropdown-item">Dashboard</a>
                        <a href="customer-dashboard.html#profile" class="profile-dropdown-item">Profile</a>
                        <div class="profile-dropdown-divider"></div>
                        <button class="profile-dropdown-item profile-dropdown-logout" id="navLogoutBtn">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="register-section">
        <div class="register-container">
            <div class="register-header">
                <div class="register-icon">➕</div>
                <h2>Create Account</h2>
                <p>Join Maneigbbe Delivery today</p>
            </div>

            <div id="errorMessage" class="register-error" style="display: none;"></div>

            <button class="btn-google" onclick="googleSignUp()">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign up with Google
            </button>

            <div class="divider"><span>or</span></div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="(555) 123-4567">
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" placeholder="Min 8 chars, upper+lower+digit" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
                </div>

                <button type="submit" class="btn-register">Create Account</button>
            </form>

            <div class="register-links">
                <p>Already have an account? <a href="customer-login.html">Sign In</a></p>
            </div>
        </div>
    </section>

    <footer class="footer" style="background: #333; color: white; text-align: center; padding: 1.5rem;">
        <div class="container">
            <p style="margin: 0; opacity: 0.8;">&copy; 2026 Maneigbbe Delivery. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/navbar.js"></script>
    <script>
        // Check for OAuth callback token
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const name = urlParams.get('name');
        const error = urlParams.get('error');

        if (token) {
            localStorage.setItem('customerToken', token);
            if (name) localStorage.setItem('customerName', name);
            window.location.href = 'customer-dashboard.html';
        }

        if (error) {
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.textContent = error === 'oauth_not_configured'
                ? 'Google Sign-Up is not configured on this server.'
                : 'Authentication failed. Please try again.';
            errorMsg.style.display = 'block';
        }

        function googleSignUp() {
            window.location.href = '/api/customers/auth/google?from=register.html';
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.style.display = 'none';

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/customers/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        phone: document.getElementById('phone').value,
                        password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('customerToken', data.token);
                    localStorage.setItem('customerName', data.customer.name);
                    window.location.href = 'customer-dashboard.html';
                } else {
                    errorMsg.textContent = data.error || data.errors?.[0]?.msg || 'Registration failed';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
