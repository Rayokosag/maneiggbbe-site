<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Maneigbbe</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .reset-section {
            padding: 3rem 1rem;
            min-height: calc(100vh - 160px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
        }
        .reset-container {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .reset-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .reset-header h2 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .reset-header p {
            color: #666;
        }
        .reset-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            color: white;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            color: #444;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #1a1a1a;
            box-shadow: 0 0 0 3px rgba(26, 26, 26, 0.1);
        }
        .btn-reset {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #1a1a1a 0%, #333333 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(26, 26, 26, 0.4);
        }
        .message {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .message-error {
            background: #fee;
            color: #c00;
        }
        .message-success {
            background: #efe;
            color: #060;
        }
        .reset-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }
        .reset-links a {
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 600;
        }
        .reset-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/mlogo.png" alt="Maneigbbe Logo">
                    <span>Maneigbbe</span>
                </a>
            </div>
            <button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="nav-menu" id="navMenu">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="tracking.html">Track Package</a></li>
                    <li><a href="request-pickup.html">Request Pickup</a></li>
                </ul>
                <a href="customer-login.html" class="nav-login-btn" id="navLoginBtn">Login</a>
                <div class="nav-profile" id="navProfile" style="display:none;">
                    <button class="profile-toggle" id="profileToggle">
                        <svg class="profile-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </button>
                    <div class="profile-dropdown" id="profileDropdown">
                        <div class="profile-dropdown-header">
                            <span class="profile-dropdown-name" id="profileDropdownName">Customer</span>
                        </div>
                        <div class="profile-dropdown-divider"></div>
                        <a href="customer-dashboard.html" class="profile-dropdown-item">Dashboard</a>
                        <a href="customer-dashboard.html#profile" class="profile-dropdown-item">Profile</a>
                        <div class="profile-dropdown-divider"></div>
                        <button class="profile-dropdown-item profile-dropdown-logout" id="navLogoutBtn">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="reset-section">
        <div class="reset-container">
            <div class="reset-header">
                <div class="reset-icon">*</div>
                <h2>Reset Password</h2>
                <p>Enter your new password below</p>
            </div>

            <div id="message" class="message" style="display: none;"></div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" placeholder="Min 8 chars, upper+lower+digit" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Repeat your password" required>
                </div>

                <button type="submit" class="btn-reset" id="submitBtn">Reset Password</button>
            </form>

            <div class="reset-links">
                <p><a href="customer-login.html">Back to Sign In</a></p>
            </div>
        </div>
    </section>

    <footer class="footer" style="background: #333; color: white; text-align: center; padding: 1.5rem;">
        <div class="container">
            <p style="margin: 0; opacity: 0.8;">&copy; 2026 Maneigbbe Delivery. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/navbar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('message').className = 'message message-error';
            document.getElementById('message').textContent = 'Invalid reset link. Please request a new one.';
            document.getElementById('message').style.display = 'block';
            document.getElementById('resetForm').style.display = 'none';
        }

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const msg = document.getElementById('message');
            const btn = document.getElementById('submitBtn');
            msg.style.display = 'none';

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                msg.className = 'message message-error';
                msg.textContent = 'Passwords do not match';
                msg.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Resetting...';

            try {
                const response = await fetch('/api/customers/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok) {
                    msg.className = 'message message-success';
                    msg.textContent = 'Password reset successfully! Redirecting to login...';
                    msg.style.display = 'block';
                    document.getElementById('resetForm').style.display = 'none';
                    setTimeout(function() {
                        window.location.href = 'customer-login.html';
                    }, 2000);
                } else {
                    msg.className = 'message message-error';
                    msg.textContent = data.error || 'Failed to reset password';
                    msg.style.display = 'block';
                }
            } catch (err) {
                msg.className = 'message message-error';
                msg.textContent = 'Connection error. Please try again.';
                msg.style.display = 'block';
            }

            btn.disabled = false;
            btn.textContent = 'Reset Password';
        });
    </script>
</body>
</html>
