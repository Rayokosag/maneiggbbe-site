<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Maneigbbe</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/mlogo.png" alt="Maneigbbe Logo">
                    <span>Maneigbbe</span>
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="tracking.html">Track Package</a></li>
                <li><a href="request-pickup.html">Request Pickup</a></li>
                <li><a href="customer-login.html">Login</a></li>
            </ul>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section">
        <div class="container">
            <div class="login-container">
                <div class="login-header">
                    <div class="login-icon">👤</div>
                    <h2>Admin Login</h2>
                    <p>Access the admin dashboard</p>
                </div>

                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <div class="input-with-icon">
                            <span class="input-icon">👤</span>
                            <input type="text" id="username" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-with-icon">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div id="totpGroup" class="form-group" style="display: none;">
                        <label for="totpCode">2FA Code</label>
                        <div class="input-with-icon">
                            <span class="input-icon">🔑</span>
                            <input type="text" id="totpCode" placeholder="Enter 6-digit code" maxlength="6" autocomplete="one-time-code">
                        </div>
                    </div>

                    <div id="errorMessage" class="login-error" style="display: none;">
                        Invalid username or password
                    </div>

                    <button type="submit" class="btn btn-login">
                        Login to Dashboard
                    </button>
                </form>

                <div class="login-demo-info">
                    <h4>Demo Credentials</h4>
                    <p><strong>Username:</strong> admin</p>
                    <p><strong>Password:</strong> admin123</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Maneigbbe Delivery. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
